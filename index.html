<style>
/* Layout: cartão central com a marca e o formulário de acesso, no mesmo visual corporativo do app */
:root{
  --bg:#0c0e12; --surface:#14171d; --field:#1a1e26; --line:rgba(255,255,255,.08); --line-strong:rgba(255,255,255,.15);
  --ink:#e6e8ec; --mute:#9aa2ae; --dim:#6c7480; --sol:#f0a83a; --bad:#ef6464;
  --f:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:14px;
  display:grid;place-items:center;padding:calc(env(safe-area-inset-top,0px) + 24px) 16px calc(env(safe-area-inset-bottom,0px) + 24px);-webkit-font-smoothing:antialiased}
.box{width:100%;max-width:380px;display:flex;flex-direction:column;gap:18px}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:40px;height:40px;border-radius:9px;display:grid;place-items:center;background:var(--sol);color:#17110a}
.logo svg{width:22px;height:22px}
h1{margin:0;font-size:20px;font-weight:700;letter-spacing:-.01em;line-height:1.1}
.sub{margin:2px 0 0;font-size:13px;color:var(--dim)}
form{width:100%;display:flex;flex-direction:column;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:22px}
form h2{margin:0 0 2px;font-size:16px;font-weight:600}
label{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:500;color:var(--mute)}
input[type=text],input[type=password]{width:100%;background:var(--field);border:1px solid var(--line);border-radius:6px;padding:11px 12px;color:var(--ink);font:15px var(--f);outline:none;transition:border-color .2s,box-shadow .2s}
input:hover{border-color:var(--line-strong)}
input:focus{border-color:var(--sol);box-shadow:0 0 0 3px rgba(240,168,58,.15)}
.remember{flex-direction:row;align-items:center;gap:8px;font-weight:400;color:var(--ink)}
.remember input{width:16px;height:16px;accent-color:var(--sol)}
button{cursor:pointer;border:1px solid var(--sol);background:var(--sol);color:#17110a;border-radius:6px;padding:11px;font:600 15px var(--f)}
button:hover{background:#f3b456}
button:disabled{opacity:.6;cursor:progress}
button:focus-visible,input:focus-visible{outline:2px solid var(--sol);outline-offset:2px}
.err{min-height:1.3em;margin:0;font-size:13px;color:var(--bad)}
.foot{font-size:12px;color:var(--dim);text-align:center;margin:0}
</style>
</head>
<body>
<main class="box">
  <div class="brand">
    <span class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.5M12 19v2.5M2.5 12H5M19 12h2.5M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8"/></svg></span>
    <div><h1>Solare</h1><p class="sub">Gestão comercial · acesso restrito</p></div>
  </div>
  <form id="f" autocomplete="on">
    <h2>Entrar</h2>
    <label>Usuário<input id="u" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required></label>
    <label>Senha<input id="p" name="password" type="password" autocomplete="current-password" required></label>
    <label class="remember"><input id="r" type="checkbox" checked>Manter conectado neste aparelho</label>
    <button id="b" type="submit">Entrar</button>
    <p class="err" id="e" role="alert"></p>
  </form>
  <p class="foot">Conteúdo criptografado. Só abre com usuário e senha.</p>
</main>

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const toB64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
const $ = id => document.getElementById(id);

async function derive(user, pass) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(user.trim().toLowerCase() + "\n" + pass), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(PAYLOAD.salt), iterations: PAYLOAD.iter, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, true, ["decrypt"]);
}
async function unlock(key) {
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(PAYLOAD.iv) }, key, b64(PAYLOAD.data));
  return new TextDecoder().decode(plain);
}
// troca a página só depois que a tela de login terminou de carregar; antes disso o document.open() não limpa os estilos do login
async function show(html) {
  if (document.readyState !== "complete") await new Promise(r => addEventListener("load", r, { once: true }));
  document.open(); document.write(html); document.close();
}

// remembered device: the saved key is tied to this exact build (salt), so a new password invalidates it
(async () => {
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem("solare.k") || sessionStorage.getItem("solare.ks") || "null"); } catch (e) {}
  if (!saved || saved.salt !== PAYLOAD.salt) return;
  try {
    const key = await crypto.subtle.importKey("raw", b64(saved.k), "AES-GCM", false, ["decrypt"]);
    await show(await unlock(key));
  } catch (e) { try { localStorage.removeItem("solare.k"); sessionStorage.removeItem("solare.ks"); } catch (x) {} }
})();

$("f").addEventListener("submit", async ev => {
  ev.preventDefault();
  const btn = $("b"), err = $("e");
  if (!window.crypto || !crypto.subtle) { err.textContent = "Este navegador não permite abrir o conteúdo. Use o link https."; return; }
  btn.disabled = true; btn.textContent = "Verificando…"; err.textContent = "";
  try {
    const key = await derive($("u").value, $("p").value);
    const html = await unlock(key);
    // a chave fica guardada no aparelho (manter conectado) ou só nesta aba, para trocar de categoria sem pedir a senha de novo
    try { const v = JSON.stringify({ salt: PAYLOAD.salt, k: toB64(await crypto.subtle.exportKey("raw", key)) }); if ($("r").checked) localStorage.setItem("solare.k", v); else sessionStorage.setItem("solare.ks", v); } catch (e) {}
    await show(html);
  } catch (e) {
    err.textContent = "Usuário ou senha incorretos.";
    btn.disabled = false; btn.textContent = "Entrar"; $("p").select();
  }
});
})();
