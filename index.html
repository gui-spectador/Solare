<style>
/* Layout: uma coluna central — o sol em miniatura, o nome e o formulário de acesso */
:root{
  --void:#06060a; --panel:rgba(16,13,11,.86); --field:rgba(255,255,255,.04); --line:rgba(255,186,110,.2);
  --ink:#f5efe7; --mute:#aba093; --sol:#ffb547; --bad:#ff6b6b;
  --f-disp:"Chakra Petch","Segoe UI",system-ui,sans-serif; --f-body:"IBM Plex Sans",system-ui,-apple-system,sans-serif; --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:radial-gradient(120% 80% at 50% 30%,#1a0f07 0%,var(--void) 60%);color:var(--ink);font-family:var(--f-body);font-size:15px;
  display:grid;place-items:center;padding:calc(env(safe-area-inset-top,0px) + 24px) 16px calc(env(safe-area-inset-bottom,0px) + 24px);-webkit-font-smoothing:antialiased}
.box{width:100%;max-width:360px;display:flex;flex-direction:column;align-items:center;gap:22px}
.sun{width:96px;height:96px;border-radius:50%;
  background:radial-gradient(circle at 42% 40%,#ffe3a0 0%,#ffb33a 32%,#f2780f 62%,#c2410a 88%,#ffb340 100%);
  box-shadow:0 0 30px 8px rgba(255,140,30,.55),0 0 90px 30px rgba(255,100,20,.25);animation:glow 5s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 36px 10px rgba(255,150,40,.65),0 0 110px 40px rgba(255,100,20,.3)}}
h1{margin:0;font-family:var(--f-disp);font-weight:600;font-size:34px;letter-spacing:.42em;padding-left:.42em;
  background:linear-gradient(180deg,#fff6e4 10%,#ffc56b 60%,#ff8c3a);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{margin:-14px 0 0;font-family:var(--f-mono);font-size:11px;letter-spacing:.2em;color:var(--mute);text-transform:uppercase}
form{width:100%;display:flex;flex-direction:column;gap:14px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:20px}
label{display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:var(--mute)}
input[type=text],input[type=password]{width:100%;background:var(--field);border:1px solid var(--line);border-radius:4px;padding:11px 12px;color:var(--ink);font:15px var(--f-mono);outline:none}
input:focus{border-color:var(--sol)}
.remember{flex-direction:row;align-items:center;gap:8px;font-size:13px;color:var(--ink)}
.remember input{width:16px;height:16px;accent-color:var(--sol)}
button{cursor:pointer;border:1px solid var(--sol);background:rgba(255,181,71,.16);color:var(--sol);border-radius:4px;padding:11px;font:600 15px var(--f-disp);letter-spacing:.12em}
button:disabled{opacity:.6;cursor:progress}
button:focus-visible,input:focus-visible{outline:2px solid var(--sol);outline-offset:2px}
.err{min-height:1.3em;margin:0;font-size:13px;color:var(--bad)}
.foot{font-size:11.5px;color:#73695f;text-align:center;margin:0}
@media (prefers-reduced-motion:reduce){.sun{animation:none}}
</style>
</head>
<body>
<main class="box">
  <div class="sun" aria-hidden="true"></div>
  <h1>SOLARE</h1>
  <p class="sub">Acesso restrito</p>
  <form id="f" autocomplete="on">
    <label>Usuário<input id="u" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required></label>
    <label>Senha<input id="p" name="password" type="password" autocomplete="current-password" required></label>
    <label class="remember"><input id="r" type="checkbox" checked>Manter conectado neste aparelho</label>
    <button id="b" type="submit">ENTRAR</button>
    <p class="err" id="e" role="alert"></p>
  </form>
  <p class="foot">Conteúdo criptografado. Só abre com usuário e senha.</p>
</main>

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const toB64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
const $ = id => document.getElementById(id);

async function derive(user, pass) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(user.trim().toLowerCase() + "\n" + pass), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(PAYLOAD.salt), iterations: PAYLOAD.iter, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, true, ["decrypt"]);
}
async function unlock(key) {
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(PAYLOAD.iv) }, key, b64(PAYLOAD.data));
  return new TextDecoder().decode(plain);
}
function show(html) { document.open(); document.write(html); document.close(); }

// remembered device: the saved key is tied to this exact build (salt), so a new password invalidates it
(async () => {
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem("solare.k") || "null"); } catch (e) {}
  if (!saved || saved.salt !== PAYLOAD.salt) return;
  try {
    const key = await crypto.subtle.importKey("raw", b64(saved.k), "AES-GCM", false, ["decrypt"]);
    show(await unlock(key));
  } catch (e) { try { localStorage.removeItem("solare.k"); } catch (x) {} }
})();

$("f").addEventListener("submit", async ev => {
  ev.preventDefault();
  const btn = $("b"), err = $("e");
  if (!window.crypto || !crypto.subtle) { err.textContent = "Este navegador não permite abrir o conteúdo. Use o link https."; return; }
  btn.disabled = true; btn.textContent = "VERIFICANDO…"; err.textContent = "";
  try {
    const key = await derive($("u").value, $("p").value);
    const html = await unlock(key);
    if ($("r").checked) { try { localStorage.setItem("solare.k", JSON.stringify({ salt: PAYLOAD.salt, k: toB64(await crypto.subtle.exportKey("raw", key)) })); } catch (e) {} }
    show(html);
  } catch (e) {
    err.textContent = "Usuário ou senha incorretos.";
    btn.disabled = false; btn.textContent = "ENTRAR"; $("p").select();
  }
});
})();
</script>
